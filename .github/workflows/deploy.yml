name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro)
        run: npm run build

      - name: Show build folders
        run: |
          echo "PWD: $(pwd)"
          echo "---- ls -la ----"
          ls -la
          echo "---- ls -la dist ----"
          ls -la dist || true
          echo "---- ls -la docs ----"
          ls -la docs || true

      - name: Normalize build folder to dist
        run: |
          if [ -d "docs" ] && [ ! -d "dist" ]; then
            echo "Moving docs -> dist (CI fallback)"
            mv docs dist
          fi
          test -d dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
